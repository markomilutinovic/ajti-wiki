<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="260" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="34" fill="#0e1b33"/>
  <text x="16" y="23" fill="#ffffff" font-family="Segoe UI, Arial" font-size="15" font-weight="bold">Webmail</text>
  <text x="820" y="23" fill="#c7cede" font-family="Segoe UI, Arial" font-size="11" text-anchor="end">ime.prezime@vasafirma.rs</text>

  <text x="20" y="66" fill="#1f2430" font-family="Segoe UI, Arial" font-size="15">Manage Your Inbox</text>

  <rect x="20" y="80" width="260" height="90" fill="#f7f9fc" stroke="#3d7fd6" stroke-width="2.5" rx="4"/>
  <text x="38" y="108" fill="#2f6fce" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Autoresponders</text>
  <text x="38" y="128" fill="#5b6478" font-family="Segoe UI, Arial" font-size="10.5">Are you going on vacation?</text>
  <text x="38" y="142" fill="#5b6478" font-family="Segoe UI, Arial" font-size="10.5">Use this to configure automated emails.</text>

  <rect x="300" y="80" width="260" height="90" fill="#fbfbfc" stroke="#d7dce5" stroke-width="1.2" rx="4"/>
  <text x="318" y="108" fill="#2f6fce" font-family="Segoe UI, Arial" font-size="13">Email Filters</text>
  <text x="318" y="128" fill="#8892a6" font-family="Segoe UI, Arial" font-size="10.5">Create and manage email filters.</text>

  <rect x="580" y="80" width="260" height="90" fill="#f7f9fc" stroke="#3d7fd6" stroke-width="2.5" rx="4"/>
  <text x="598" y="108" fill="#2f6fce" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Forwarders</text>
  <text x="598" y="128" fill="#5b6478" font-family="Segoe UI, Arial" font-size="10.5">Send a copy of incoming email</text>
  <text x="598" y="142" fill="#5b6478" font-family="Segoe UI, Arial" font-size="10.5">from this address to another.</text>

  <circle cx="272" cy="72" r="13" fill="#d6402c"/>
  <text x="272" y="77" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" text-anchor="middle">1</text>

  <circle cx="832" cy="72" r="13" fill="#d6402c"/>
  <text x="832" y="77" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" text-anchor="middle">2</text>

  <text x="20" y="210" fill="#8892a6" font-family="Segoe UI, Arial" font-size="11">Krug 1 = Autoresponders (Deo 1). Krug 2 = Forwarders (Deo 2).</text>
</svg>
