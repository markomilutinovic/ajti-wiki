<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <rect x="0" y="0" width="900" height="34" fill="#0e1b33"/>
  <text x="16" y="23" fill="#ffffff" font-family="Segoe UI, Arial" font-size="15" font-weight="bold">Webmail</text>
  <text x="20" y="64" fill="#1f2430" font-family="Segoe UI, Arial" font-size="16" font-weight="bold">Add Autoresponder</text>

  <text x="20" y="92" fill="#1f2430" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">From:</text>
  <rect x="20" y="98" width="380" height="24" fill="#ffffff" stroke="#b9c0cf" rx="3"/>

  <text x="20" y="140" fill="#1f2430" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Subject:</text>
  <rect x="20" y="146" width="380" height="24" fill="#ffffff" stroke="#3d7fd6" stroke-width="2" rx="3"/>
  <text x="28" y="163" fill="#5b6478" font-family="Segoe UI, Arial" font-size="11" font-style="italic">Odsutan sam iz kancelarije</text>
  <circle cx="415" cy="158" r="12" fill="#d6402c"/>
  <text x="415" y="163" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" text-anchor="middle">1</text>

  <rect x="20" y="184" width="14" height="14" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="40" y="195" fill="#1f2430" font-family="Segoe UI, Arial" font-size="11.5" font-weight="bold">This message contains HTML.</text>
  <circle cx="300" cy="191" r="12" fill="#d6402c"/>
  <text x="300" y="196" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" text-anchor="middle">2</text>

  <text x="20" y="222" fill="#1f2430" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Body:</text>
  <rect x="20" y="228" width="700" height="70" fill="#ffffff" stroke="#3d7fd6" stroke-width="2" rx="3"/>
  <text x="28" y="248" fill="#5b6478" font-family="Segoe UI, Arial" font-size="11" font-style="italic">Trenutno sam odsutan/na. Vraćam se 15.09.2026.</text>
  <text x="28" y="264" fill="#5b6478" font-family="Segoe UI, Arial" font-size="11" font-style="italic">Za hitne stvari: Ime Prezime, kolega@vasafirma.rs</text>
  <circle cx="735" cy="240" r="12" fill="#d6402c"/>
  <text x="735" y="245" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" text-anchor="middle">3</text>

  <text x="20" y="322" fill="#1f2430" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Start:</text>
  <circle cx="26" cy="338" r="5" fill="#3d7fd6"/>
  <text x="38" y="342" fill="#1f2430" font-family="Segoe UI, Arial" font-size="11.5">Immediately</text>
  <circle cx="140" cy="338" r="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="152" y="342" fill="#2f6fce" font-family="Segoe UI, Arial" font-size="11.5">Custom</text>
  <circle cx="270" cy="335" r="12" fill="#d6402c"/>
  <text x="270" y="340" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" text-anchor="middle">4</text>

  <text x="20" y="372" fill="#1f2430" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Stop:</text>
  <circle cx="26" cy="388" r="5" fill="#ffffff" stroke="#b9c0cf"/>
  <text x="38" y="392" fill="#1f2430" font-family="Segoe UI, Arial" font-size="11.5">Never</text>
  <circle cx="120" cy="388" r="5" fill="#3d7fd6"/>
  <text x="132" y="392" fill="#2f6fce" font-family="Segoe UI, Arial" font-size="11.5" font-weight="bold">Custom: 15.09.2026</text>
  <circle cx="300" cy="385" r="12" fill="#d6402c"/>
  <text x="300" y="390" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" text-anchor="middle">5</text>

  <rect x="20" y="408" width="90" height="26" fill="#2f6fce" rx="4"/>
  <text x="65" y="425" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" text-anchor="middle">Create</text>
  <circle cx="128" cy="421" r="12" fill="#d6402c"/>
  <text x="128" y="426" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" text-anchor="middle">6</text>
